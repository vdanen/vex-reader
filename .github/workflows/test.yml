name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run tests with unittest
      run: uv run python -m unittest discover tests -v

    - name: Run tests with pytest
      run: uv run pytest tests/ -v --tb=short

    - name: Run tests with coverage
      run: uv run pytest tests/ --cov=vex --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run flake8
      run: uv run flake8 vex/ --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true

    - name: Run black (check only)
      run: uv run black --check --diff vex/
      continue-on-error: true

    - name: Run isort (check only)
      run: uv run isort --check-only --diff vex/
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run safety check
      run: uv run safety check --json --output safety-report.json
      continue-on-error: true

    - name: Run bandit security scan
      run: uv run bandit -r vex/ -f json -o bandit-report.json
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Build package
      run: uv build

    - name: Check package
      run: uv run twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: dist
        path: dist/

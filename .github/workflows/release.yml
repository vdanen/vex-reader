name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Ensure tagged commit is on main
      run: |
        git fetch --no-tags origin main
        if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
          echo "::error::Tag '${GITHUB_REF_NAME}' points to ${GITHUB_SHA}, which is not on main. Merge to main before tagging a release."
          exit 1
        fi
        echo "Tag '${GITHUB_REF_NAME}' is on main; continuing."

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Verify tag matches package version
      run: |
        expected="${GITHUB_REF_NAME#v}"
        actual=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
        if [ "$expected" != "$actual" ]; then
          echo "::error::Tag '${GITHUB_REF_NAME}' does not match pyproject.toml version '${actual}'"
          exit 1
        fi
        echo "Publishing version ${actual}"

    - name: Build package
      run: uv build

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

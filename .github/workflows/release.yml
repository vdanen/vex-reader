name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Ensure tagged commit is on main
      run: |
        git fetch --no-tags origin main
        if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
          echo "::error::Tag '${GITHUB_REF_NAME}' points to ${GITHUB_SHA}, which is not on main. Merge to main before tagging a release."
          exit 1
        fi
        echo "Tag '${GITHUB_REF_NAME}' is on main; continuing."

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Verify tag matches package version
      run: |
        expected="${GITHUB_REF_NAME#v}"
        actual=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
        if [ "$expected" != "$actual" ]; then
          echo "::error::Tag '${GITHUB_REF_NAME}' does not match pyproject.toml version '${actual}'"
          exit 1
        fi
        echo "Publishing version ${actual}"

    - name: Build package
      run: uv build

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

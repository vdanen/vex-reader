[project]
name = "vex-reader"
version = "0.9.5.2"
authors = [
  { name="Vincent Danen", email="vdanen@annvix.com" },
]
description = "Read VEX files"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests==2.34.2",
    "rich>=13.8.1",
    "pytz>=2024.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "coverage==7.16.0",
    "flake8==7.3.0",
    "black==26.5.1",
    "isort==9.0.1",
    "build==1.6.0",
    "twine==7.0.0",
    "pkginfo==1.13",
    "bandit[toml]",
    "safety",
]

[project.scripts]
vex-reader = "vex.vex_reader:main"

[project.urls]
Homepage = "https://github.com/vdanen/vex-reader"
Issues = "https://github.com/vdanen/vex-reader/issues"
Changelog = "https://github.com/vdanen/vex-reader/blob/main/CHANGELOG.md"
Repository = "https://github.com/vdanen/vex-reader"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vex*"]
exclude = ["tests*", "hooks*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["vex"]
omit = [
    "tests/*",
    "*/test_*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
